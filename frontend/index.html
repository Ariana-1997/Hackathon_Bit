<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#395E83" />
    <meta name="description" content="Entre Vecinos - Oficios locales, cadena de favores y auxilio barrial sin costo de transporte." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2348739E'><path d='M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z'/></svg>" />
    <!-- Leaflet CSS for maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Entre Vecinos | Pachacamac</title>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased selection:bg-brand-500 selection:text-white font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for Offline Capabilities with auto-update
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=17')
            .then(reg => {
              reg.update();
              console.log('✅ PWA Service Worker v3 activo:', reg.scope);
            })
            .catch(err => console.log('Service Worker no registrado:', err));
        });

        // Auto-refresh when new service worker takes over
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
